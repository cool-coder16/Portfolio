<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maze Robot Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Maze Robot Simulator</h1>
  <p>Click cells to add or remove walls. Use arrow keys to drive the robot from blue (start) to gold (end).</p>

  <canvas id="mazeCanvas"></canvas>

  <p id="sensorReadout" class="readout"></p>

  <div class="controls">
    <button id="solveButton" class="btn">Solve</button>
    <button id="resetButton" class="btn">Reset</button>
    <button id="randomizeButton" class="btn">Randomize Maze</button>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:#f0f0f0;"></span>Wall</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#3aa0ff;"></span>Start</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#ffcc33;"></span>End</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#ffffff;"></span>Robot</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#39ff88;"></span>Sensor: clear</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#ff3b3b;"></span>Sensor: wall</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#ffcc33;"></span>Actual path taken</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#3aa0ff;"></span>Shortest path</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
