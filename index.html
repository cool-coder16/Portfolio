<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maze Robot Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Maze Robot Simulator</h1>
  <p>Click cells to add or remove walls. Use arrow keys to drive the robot from green (start) to gold (end).</p>

  <canvas id="mazeCanvas"></canvas>

  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:#f0f0f0;"></span>Wall</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#39ff88;"></span>Start</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#ffcc33;"></span>End</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#ff2fd0;"></span>Robot</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
