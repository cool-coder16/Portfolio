<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Maze Robot Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <main>
      <h1>Maze Robot Simulator</h1>
      <p>Click cells to add or remove walls. Use arrow keys to drive the robot from start to end.</p>

      <canvas id="mazeCanvas"></canvas>

      <p id="sensorReadout" class="readout"></p>

      <div class="controls">
        <button id="solveButton" class="btn">Solve</button>
        <button id="resetButton" class="btn">Reset Robot</button>
        <button id="resetMazeButton" class="btn">Reset Maze</button>
        <button id="randomizeButton" class="btn">Randomize Maze</button>
      </div>
    </main>

    <aside class="legend">
      <h2>Colors</h2>

      <label class="legend-item">
        <input type="color" class="legend-swatch" id="color-wall" value="#f0f0f0">
        Wall
      </label>
      <label class="legend-item">
        <input type="color" class="legend-swatch" id="color-start" value="#3aa0ff">
        Start
      </label>
      <label class="legend-item">
        <input type="color" class="legend-swatch" id="color-end" value="#ffcc33">
        End
      </label>
      <label class="legend-item">
        <input type="color" class="legend-swatch" id="color-robot" value="#ffffff">
        Robot
      </label>
      <label class="legend-item">
        <input type="color" class="legend-swatch" id="color-robot-highlight" value="#ff3b3b">
        Robot Highlight
      </label>
      <label class="legend-item">
        <input type="color" class="legend-swatch" id="color-sensor-clear" value="#39ff88">
        Sensor: clear
      </label>
      <label class="legend-item">
        <input type="color" class="legend-swatch" id="color-sensor-wall" value="#ff3b3b">
        Sensor: wall
      </label>
      <label class="legend-item">
        <input type="color" class="legend-swatch" id="color-actual-path" value="#ffcc33">
        Actual path taken
      </label>
      <label class="legend-item">
        <input type="color" class="legend-swatch" id="color-shortest-path" value="#3aa0ff">
        Shortest path
      </label>

      <button id="resetColorsButton" class="btn">Reset All Colors</button>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
