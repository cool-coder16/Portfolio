<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PID Panel</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="nav-brand">
        <img src="favicon.svg" alt="Logo" class="nav-logo" />
        <span class="nav-title">Vivaan Loiwal</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <div class="nav-item-dropdown">
          <a href="projects.html" class="nav-link active">Projects</a>
          <div class="dropdown-menu" id="navProjectsDropdown"></div>
        </div>
      </div>
      <button id="themeToggle" class="btn theme-toggle">Light Mode</button>
    </nav>

    <p class="breadcrumb"><a href="projects.html">&larr; Back to Projects</a></p>

    <div class="page">
      <aside class="controls-panel sidebar-panel">
        <h2>Gains</h2>

        <div class="slider-item">
          <label for="pSlider">P: <span id="pValue">1.0</span></label>
          <input type="range" id="pSlider" min="0" max="20" step="0.1" value="1" />
        </div>

        <div class="slider-item">
          <label for="iSlider">I: <span id="iValue">0.00</span></label>
          <input type="range" id="iSlider" min="0" max="10" step="0.05" value="0" />
        </div>

        <div class="slider-item">
          <label for="dSlider">D: <span id="dValue">0.00</span></label>
          <input type="range" id="dSlider" min="0" max="10" step="0.05" value="0" />
        </div>

        <button id="resetGainsButton" class="btn">Reset Gains</button>
      </aside>

      <main>
        <h1>PID Panel</h1>
        <p>Adjust the P, I, and D gains and watch how the system responds.</p>

        <canvas id="pidCanvas" width="600" height="360"></canvas>

        <p id="pidReadout" class="readout">Gold dashed line = setpoint. Cyan line = the system's actual position.</p>

        <button id="resetTimeButton" class="btn">Reset Time</button>
      </main>
    </div>

    <script src="projects-data.js"></script>
    <script src="nav.js"></script>
    <script src="pid-panel.js"></script>
  </body>
</html>
