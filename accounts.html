<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio — Account</title>
    <meta name="description" content="Sign in to save your progress across Vivaan Loiwal's portfolio projects." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Account — Vivaan Loiwal's Portfolio" />
    <meta property="og:description" content="Sign in to save your progress across Vivaan Loiwal's portfolio projects." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="nav-brand">
        <img src="favicon.svg" alt="Logo" class="nav-logo" />
        <span class="nav-title">Vivaan Loiwal</span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <div class="nav-item-dropdown">
          <a href="projects.html" class="nav-link">Projects</a>
          <div class="dropdown-menu" id="navProjectsDropdown"></div>
        </div>
        <a href="accounts.html" class="nav-link active">Accounts</a>
      </div>
      <div class="nav-actions">
        <button id="themeToggle" class="btn theme-toggle">Light Mode</button>
        <button id="authNavButton" class="btn theme-toggle">Login</button>
      </div>
    </nav>

    <main class="account-page">
      <div id="accountLoggedOut" class="account-panel">
        <h1>Account</h1>
        <p class="account-hint">Log in to view and edit your profile.</p>
        <button id="accountLoginButton" class="btn">Log In</button>
      </div>

      <div id="accountLoggedIn" class="account-panel auth-hidden">
        <h1>Account</h1>

        <div class="account-avatar-wrap">
          <div id="accountAvatar" class="account-avatar"></div>
          <label for="accountPictureInput" class="btn">Change Picture</label>
          <input
            type="file"
            id="accountPictureInput"
            class="account-file-input"
            accept="image/*"
          />
          <p id="accountUploadStatus" class="account-hint"></p>
        </div>

        <div class="account-field">
          <label for="accountUsernameInput">Username</label>
          <input
            type="text"
            id="accountUsernameInput"
            class="auth-input"
            placeholder="Choose a username"
          />
          <button id="accountSaveUsernameButton" class="btn">Save</button>
        </div>

        <p class="account-hint">
          Signed in as <span id="accountEmailDisplay"></span><br />
          <span id="accountMemberSince"></span>
        </p>

        <button id="accountLogoutButton" class="btn">Log Out</button>
      </div>
    </main>

    <script src="projects-data.js"></script>
    <script src="nav.js"></script>
    <script src="accounts.js"></script>
    <script type="module" src="auth.js"></script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
